[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multifractal-time-gpt"
version = "0.1.0"
description = "Markov-Switching Multifractal volatility regimes fused with news sentiment and time-series foundation models for event-driven trading."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Case Ollila" }]
keywords = ["quantitative-finance", "multifractal", "msm", "regime-switching",
            "news-sentiment", "timegpt", "event-driven", "volatility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
foundation = ["nixtla>=0.5", "pandas>=2.0"]
dev = ["pytest>=7.4", "httpx>=0.27", "pandas>=2.0"]
all = [
    "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0",
    "nixtla>=0.5", "pandas>=2.0", "pytest>=7.4", "httpx>=0.27",
]

[project.scripts]
mtgpt = "mtgpt.cli:main"

[tool.setuptools.packages.find]
include = ["mtgpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: estimation-heavy tests; deselect with -m 'not slow'",
]
filterwarnings = ["ignore::RuntimeWarning"]
